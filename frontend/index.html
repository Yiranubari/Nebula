<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>Nebula Task & Chat</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#6366f1", // Indigo 500
              secondary: "#a855f7", // Purple 500 (accent)
              accent: "#ec4899", // Pink 500
              dark: "#0b1120", // a touch deeper than slate-900 to match landing
              surface: "#0f172a", // slate-900 — used as card surface in dark
              "surface-2": "#111a2f", // elevated panel
            },
            backgroundImage: {
              "brand-gradient":
                "linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%)",
              "brand-text":
                "linear-gradient(90deg, #ffffff 0%, rgba(255,255,255,0.6) 100%)",
              "brand-accent":
                "linear-gradient(90deg, #818cf8 0%, #c084fc 50%, #f472b6 100%)",
            },
            boxShadow: {
              glow: "0 0 40px rgba(99, 102, 241, 0.35)",
              "glow-lg": "0 0 60px rgba(99, 102, 241, 0.45)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0b1120;
      }
      html.dark body {
        background-color: #0b1120;
      }
      html:not(.dark) body {
        background-color: #f8fafc;
      }

      /* Utility: gradient brand text */
      .text-brand {
        background-image: linear-gradient(
          90deg,
          #ffffff 0%,
          rgba(255, 255, 255, 0.6) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      html:not(.dark) .text-brand {
        background-image: linear-gradient(90deg, #0f172a 0%, #475569 100%);
      }
      .text-brand-accent {
        background-image: linear-gradient(
          90deg,
          #6366f1 0%,
          #a855f7 50%,
          #ec4899 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Glass panel surface used across the app */
      .glass-panel {
        background-color: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(15, 23, 42, 0.08);
      }
      html.dark .glass-panel {
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-panel-strong {
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(15, 23, 42, 0.08);
      }
      html.dark .glass-panel-strong {
        background-color: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Atmospheric background — subtle gradient orbs & grid */
      .app-atmosphere {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .app-atmosphere::before,
      .app-atmosphere::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
      }
      html.dark .app-atmosphere::before {
        top: -12%;
        left: -12%;
        width: 45%;
        height: 45%;
        background: #6366f1;
      }
      html.dark .app-atmosphere::after {
        bottom: -12%;
        right: -12%;
        width: 50%;
        height: 50%;
        background: #a855f7;
        opacity: 0.25;
      }
      html:not(.dark) .app-atmosphere::before {
        top: -15%;
        left: -12%;
        width: 35%;
        height: 35%;
        background: #a5b4fc;
        opacity: 0.5;
      }
      html:not(.dark) .app-atmosphere::after {
        bottom: -15%;
        right: -12%;
        width: 35%;
        height: 35%;
        background: #f9a8d4;
        opacity: 0.35;
      }
      .app-atmosphere-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: linear-gradient(
            to right,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          );
        background-size: 4rem 4rem;
        mask-image: radial-gradient(
          ellipse 60% 50% at 50% 50%,
          #000 60%,
          transparent 100%
        );
      }
      html:not(.dark) .app-atmosphere-grid {
        background-image: linear-gradient(
            to right,
            rgba(15, 23, 42, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(15, 23, 42, 0.05) 1px,
            transparent 1px
          );
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
