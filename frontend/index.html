<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <title>Nebula Task & Chat</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#6366f1", // Indigo 500
              secondary: "#a855f7", // Purple 500 (accent)
              accent: "#ec4899", // Pink 500
              dark: "#0b1120", // a touch deeper than slate-900 to match landing
              surface: "#0f172a", // slate-900, used as card surface in dark
              "surface-2": "#111a2f", // elevated panel
            },
            backgroundImage: {
              "brand-gradient":
                "linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%)",
              "brand-text":
                "linear-gradient(90deg, #ffffff 0%, rgba(255,255,255,0.6) 100%)",
              "brand-accent":
                "linear-gradient(90deg, #818cf8 0%, #c084fc 50%, #f472b6 100%)",
            },
            boxShadow: {
              glow: "0 0 40px rgba(99, 102, 241, 0.35)",
              "glow-lg": "0 0 60px rgba(99, 102, 241, 0.45)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0b1120;
      }
      html.dark body {
        background-color: #0b1120;
      }
      html:not(.dark) body {
        background-color: #f8fafc;
      }

      /* Utility: solid brand text (plain, theme-aware) */
      .text-brand {
        color: #f8fafc;
      }
      html:not(.dark) .text-brand {
        color: #0f172a;
      }
      .text-brand-accent {
        color: #6366f1;
      }

      /* Glass panel surfaces, borderless, elevated by soft layered shadows.
         box-shadow uses !important because the Tailwind CDN injects utilities
         (e.g. `shadow-sm`) after this stylesheet, so a plain declaration would
         lose the cascade race when markup combines `glass-panel shadow-sm`. */
      .glass-panel {
        background-color: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(14px);
        border: 0;
        box-shadow:
          0 2px 6px rgba(15, 23, 42, 0.14),
          0 20px 44px -10px rgba(15, 23, 42, 0.28) !important;
      }
      html.dark .glass-panel {
        background-color: rgba(255, 255, 255, 0.03);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 18px 44px -12px rgba(0, 0, 0, 0.75) !important;
      }
      .glass-panel-strong {
        background-color: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(18px);
        border: 0;
        box-shadow:
          0 3px 8px rgba(15, 23, 42, 0.16),
          0 28px 56px -14px rgba(15, 23, 42, 0.32) !important;
      }
      html.dark .glass-panel-strong {
        background-color: rgba(255, 255, 255, 0.04);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.07) inset,
          0 24px 56px -16px rgba(0, 0, 0, 0.8) !important;
      }
      /* Borderless soft surface, for cards that should feel like the landing page */
      .soft-surface {
        background-color: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        border: 0;
        box-shadow:
          0 2px 5px rgba(15, 23, 42, 0.12),
          0 14px 32px -10px rgba(15, 23, 42, 0.22) !important;
        transition: background-color 0.2s ease, box-shadow 0.2s ease,
          transform 0.2s ease;
      }
      html.dark .soft-surface {
        background-color: rgba(255, 255, 255, 0.03);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 12px 28px -10px rgba(0, 0, 0, 0.65) !important;
      }
      .soft-surface:hover {
        background-color: rgba(255, 255, 255, 0.96);
        box-shadow:
          0 3px 8px rgba(15, 23, 42, 0.16),
          0 22px 44px -10px rgba(15, 23, 42, 0.28) !important;
      }
      html.dark .soft-surface:hover {
        background-color: rgba(255, 255, 255, 0.06);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.08) inset,
          0 22px 48px -12px rgba(0, 0, 0, 0.8) !important;
      }

      /* Atmospheric background, subtle gradient orbs and grid */
      .app-atmosphere {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .app-atmosphere::before,
      .app-atmosphere::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.35;
      }
      html.dark .app-atmosphere::before {
        top: -12%;
        left: -12%;
        width: 45%;
        height: 45%;
        background: #6366f1;
      }
      html.dark .app-atmosphere::after {
        bottom: -12%;
        right: -12%;
        width: 50%;
        height: 50%;
        background: #a855f7;
        opacity: 0.25;
      }
      html:not(.dark) .app-atmosphere::before {
        top: -15%;
        left: -12%;
        width: 35%;
        height: 35%;
        background: #a5b4fc;
        opacity: 0.5;
      }
      html:not(.dark) .app-atmosphere::after {
        bottom: -15%;
        right: -12%;
        width: 35%;
        height: 35%;
        background: #f9a8d4;
        opacity: 0.35;
      }
      .app-atmosphere-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: linear-gradient(
            to right,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          );
        background-size: 4rem 4rem;
        mask-image: radial-gradient(
          ellipse 60% 50% at 50% 50%,
          #000 60%,
          transparent 100%
        );
      }
      html:not(.dark) .app-atmosphere-grid {
        background-image: linear-gradient(
            to right,
            rgba(15, 23, 42, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(15, 23, 42, 0.05) 1px,
            transparent 1px
          );
      }

      /* Native <select> option list, force readable colors per theme.
         Browsers render the option popup using OS-level styling by default,
         which gives white-on-white in dark mode on most platforms. */
      html:not(.dark) select option {
        background-color: #ffffff;
        color: #0f172a;
      }
      html.dark select option {
        background-color: #0f172a;
        color: #f1f5f9;
      }
      html.dark select option:checked {
        background-color: #1e293b;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
