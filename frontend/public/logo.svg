<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Core sphere: pale indigo highlight → violet mid → deep indigo shadow -->
    <linearGradient id="core" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7d2fe"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <!-- Orbital ring: fades in, peaks through pink/orange, fades out -->
    <linearGradient id="ring" x1="4" y1="20" x2="36" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="0.8" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft ambient nebula glow -->
    <radialGradient id="glow" cx="20" cy="20" r="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow behind everything -->
  <circle cx="20" cy="20" r="19" fill="url(#glow)"/>

  <!-- Everything tilted ~22° so the ring reads as an orbit, not a belt -->
  <g transform="rotate(-22 20 20)">
    <!-- Back half of ring (drawn first, behind the core) -->
    <path
      d="M 4 20 A 16 4.5 0 0 1 36 20"
      stroke="url(#ring)"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
      opacity="0.55"
    />

    <!-- Core sphere -->
    <circle cx="20" cy="20" r="9" fill="url(#core)"/>
    <!-- Subtle specular highlight, upper-left -->
    <ellipse cx="17.2" cy="16.5" rx="3.5" ry="2.2" fill="#ffffff" fill-opacity="0.28"/>

    <!-- Front half of ring (drawn last, passes in front of the core) -->
    <path
      d="M 36 20 A 16 4.5 0 0 1 4 20"
      stroke="url(#ring)"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
