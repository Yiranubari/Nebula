<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none">
  <defs>
    <linearGradient id="w-core" x1="10" y1="10" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7d2fe"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="w-ring" x1="4" y1="20" x2="36" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="0.8" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="w-glow" cx="20" cy="20" r="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-text" x1="50" y1="0" x2="180" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <circle cx="20" cy="20" r="19" fill="url(#w-glow)"/>
  <g transform="rotate(-22 20 20)">
    <path d="M 4 20 A 16 4.5 0 0 1 36 20" stroke="url(#w-ring)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
    <circle cx="20" cy="20" r="9" fill="url(#w-core)"/>
    <ellipse cx="17.2" cy="16.5" rx="3.5" ry="2.2" fill="#ffffff" fill-opacity="0.28"/>
    <path d="M 36 20 A 16 4.5 0 0 1 4 20" stroke="url(#w-ring)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text
    x="52" y="28"
    fill="url(#w-text)"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="-0.02em"
  >Nebula</text>
</svg>
